<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EEEEEE;
  --ink:#171A20; --ink-soft:#5C5E62;
  --line:#CCCCCC; --line-strong:#171A20;
  --accent:#171A20; --accent-soft:rgba(23,26,32,0.06); --accent-ink:#FFFFFF;
  --cta:#3E6AE1; --cta-hover:#3559bd; --cta-ink:#FFFFFF;
}
:root[data-theme="dark"]{
  --bg:#0A0C10; --surface:#0A0C10; --surface-2:#15181D;
  --ink:#F5F5F3; --ink-soft:#93989F;
  --line:rgba(245,245,243,0.16); --line-strong:#F5F5F3;
  --accent:#F5F5F3; --accent-soft:rgba(245,245,243,0.1); --accent-ink:#0A0C10;
  --cta:#3E6AE1; --cta-hover:#5c85e8; --cta-ink:#FFFFFF;
}

html, body{ overflow-x:hidden; max-width:100%; }
.tl-page{ background:var(--bg); color:var(--ink); font-family:'Inter',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.43; }
.tl-page *{ box-sizing:border-box; }
.tl-page a{ color:inherit; }
.tl-page p a:not(.btn), .tl-page li a:not(.btn){ color:var(--cta); text-decoration:underline; text-underline-offset:2px; transition:color .15s ease; }
.tl-page p a:not(.btn):hover, .tl-page li a:not(.btn):hover{ color:var(--cta-hover); }
.tl-page .mono{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
.tl-page .eyebrow{ color:var(--accent); }
.tl-page h1, .tl-page h2, .tl-page h3{ font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:500; text-transform:none; letter-spacing:-0.01em; margin:0; text-wrap:balance; }
.tl-page .container{ max-width:1600px; margin:0 auto; padding:0 clamp(20px, 5vw, 96px); }
.tl-page section{ padding:clamp(56px, 9vw, 168px) 0; }

/* ---------- Shared header ---------- */
.tl-header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.tl-header .nav-row{ display:flex; align-items:center; justify-content:space-between; padding-top:clamp(16px,2vw,26px); padding-bottom:clamp(16px,2vw,26px); max-width:1600px; margin:0 auto; padding-left:clamp(20px,5vw,96px); padding-right:clamp(20px,5vw,96px); }
.tl-header .logo{ display:flex; align-items:center; text-decoration:none; flex-shrink:0; }
.tl-header .logo img{ display:block; height:20px; width:auto; flex-shrink:0; }
@media (max-width:520px){ .tl-header .logo img{ height:16px; } }
.tl-header nav.main{ display:flex; gap:0; align-items:center; flex-shrink:1; min-width:0; }
.tl-header nav.main a{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:13.5px; font-weight:500; letter-spacing:0; text-transform:none; text-decoration:none; color:var(--ink); padding:8px clamp(7px,0.85vw,14px); border-left:none; transition:color .12s ease; white-space:nowrap; }
.tl-header nav.main a:hover{ color:var(--ink); }
.tl-header .nav-dropdown{ position:relative; flex-shrink:0; }
.tl-header .nav-dropdown > button{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:13.5px; font-weight:500; color:var(--ink); background:none; border:none; cursor:pointer; padding:8px clamp(7px,0.85vw,14px); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.tl-header .nav-dropdown .chevron{ width:9px; height:9px; margin-top:1px; }
.tl-header .nav-dropdown-menu{ position:absolute; top:100%; left:18px; background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:8px; min-width:200px; box-shadow:0 16px 36px rgba(0,0,0,.14); opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .15s ease, transform .15s ease, visibility .15s; z-index:60; }
.tl-header .nav-dropdown:hover .nav-dropdown-menu, .tl-header .nav-dropdown:focus-within .nav-dropdown-menu{ opacity:1; visibility:visible; transform:translateY(0); }
.tl-header .nav-dropdown-menu a{ display:block; padding:10px 12px; border-radius:10px; font-size:14px; }
.tl-header .nav-dropdown-menu a:hover{ background:var(--surface-2); }
.tl-header .nav-utils{ display:flex; align-items:center; gap:16px; flex-shrink:0; }
.tl-header .icon-btn{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink-soft); transition:color .15s ease; }
.tl-header .icon-btn:hover{ color:var(--ink); }
.tl-header .icon-btn svg{ width:18px; height:18px; display:block; }
.tl-header nav.main a.nav-cta{
  font-weight:600; color:#fff; padding:10px 20px; border-radius:9999px; margin-left:20px; flex-shrink:0;
  background:rgba(77,120,255,.72); border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(200%); -webkit-backdrop-filter:blur(18px) saturate(200%);
  animation:heroCtaGlow 2.4s ease-in-out infinite;
}
.tl-header nav.main a.nav-cta:hover{ color:#fff; opacity:1; background:rgba(77,120,255,.85); }
@media (prefers-reduced-motion: reduce){ .tl-header nav.main a.nav-cta{ animation:none; box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 8px 38px rgba(90,135,255,.65); } }
@media (max-width:1480px){ .tl-header nav.main{ display:none; } }
.tl-header .menu-toggle{ display:none; font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:600; font-size:14px; padding:9px 18px; border-radius:9999px; background:var(--surface-2); border:none; color:var(--ink); cursor:pointer; }
@media (max-width:1480px){ .tl-header .menu-toggle{ display:inline-block; } .tl-header .icon-btn{ display:none; } }
/* Buchen-Button neben "Menü": unter 1481px ist nav.main (inkl. .nav-cta) ausgeblendet, damit bleibt "Buchen" auf jeder Seite oben sichtbar. Darüber übernimmt .nav-cta in der Hauptnavigation. */
.tl-header .nav-book{ display:none; }
@media (max-width:1480px){
  .tl-header .nav-book{
    display:inline-flex; align-items:center; font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:600; font-size:14px; line-height:normal;
    padding:9px 18px; border-radius:9999px; text-decoration:none; color:#fff; flex-shrink:0;
    background:rgba(77,120,255,.72); border:1px solid rgba(255,255,255,.55);
    backdrop-filter:blur(18px) saturate(200%); -webkit-backdrop-filter:blur(18px) saturate(200%);
    animation:heroCtaGlow 2.4s ease-in-out infinite;
  }
  .tl-header .nav-book:hover{ color:#fff; background:rgba(77,120,255,.85); }
}
@media (max-width:420px){
  .tl-header .nav-utils{ gap:6px; }
  .tl-header .nav-book, .tl-header .menu-toggle{ padding:8px 13px; font-size:13.5px; }
  .tl-header .logo img{ height:clamp(11px, 3.8vw, 16px); }
}
@media (max-width:345px){ .tl-header .nav-book, .tl-header .menu-toggle{ padding:7px 10px; font-size:13px; } .tl-header .logo img{ height:11px; } }
@media (prefers-reduced-motion: reduce){ .tl-header .nav-book{ animation:none; box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 8px 38px rgba(90,135,255,.65); } }
.lang-switcher{ display:flex; align-items:center; gap:13px; }
.lang-btn{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; line-height:1; padding:0; border:none; background:none; cursor:pointer; color:var(--ink-soft); transition:color .15s ease; display:inline-flex; align-items:center; height:24px; }
.lang-btn:hover{ color:var(--ink); }
.lang-btn.is-active{ color:var(--accent); }
@media (max-width:1480px){ .tl-header .nav-utils .lang-switcher{ display:none; } }
.mobile-menu .lang-switcher{ position:absolute; top:30px; left:28px; margin:0; gap:16px; z-index:2; }
.mobile-menu .lang-btn{ font-size:13px; }
.gtranslate_wrapper{ display:none !important; }
.mobile-menu{ display:none; }
@media (max-width:1480px){
  .mobile-menu{
    display:flex; flex-direction:column; justify-content:flex-start; gap:36px;
    position:fixed; inset:0; background:var(--bg); z-index:100;
    padding:32px; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    opacity:0; visibility:hidden; transition:opacity .22s ease, visibility .22s;
  }
  .mobile-menu.is-open{ opacity:1; visibility:visible; }
  .mobile-menu-close{ position:absolute; top:20px; right:20px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:32px; line-height:1; font-weight:400; background:none; border:none; color:var(--ink); cursor:pointer; }
  .mobile-menu-inner{ display:flex; flex-direction:column; align-items:center; gap:36px; width:100%; margin:0; padding:60px 0 40px; box-sizing:border-box; }
  .mobile-menu nav{ display:flex; flex-direction:column; gap:8px; align-items:center; }
  .mobile-menu nav a{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:28px; font-weight:700; color:var(--ink); text-decoration:none; padding:14px 0; }
  .mobile-menu nav .mobile-nav-label{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:8px; }
  .mobile-menu nav a.mobile-nav-sub{ font-size:28px; font-weight:700; padding:14px 0 14px 16px; color:var(--ink); }
  .mobile-menu nav a.mobile-nav-cta{ background:var(--ink); color:var(--bg); font-size:19px; padding:14px 32px; border-radius:9999px; margin-top:8px; }
}

/* ---------- Shared footer ---------- */
/* Footer-Raster: Logo, beide Trennlinien, Menue und Copyright-Zeile buendig mit .container (max. 1600px inkl. Seitenpadding, wie .tl-page). Desktop: Spalten in Inhaltsbreite, erste Spalte an der linken, letzte an der rechten Kante. */
.tl-footer{ padding:64px 0 0; margin-top:40px; background:var(--bg); color:var(--ink); font-family:'Inter',Helvetica,Arial,sans-serif; }
.tl-footer *, .tl-footer *::before, .tl-footer *::after{ box-sizing:border-box; }
.tl-footer .container{ max-width:1600px; margin:0 auto; padding:0 clamp(20px, 5vw, 96px); }
.tl-footer .foot-grid{ display:grid; grid-auto-flow:column; grid-auto-columns:max-content; justify-content:space-between; gap:32px; border-top:1px solid var(--line-strong); }
@media (max-width:980px){ .tl-footer .foot-grid{ grid-auto-flow:row; grid-template-columns:repeat(3,minmax(0,1fr)); justify-content:stretch; } }
@media (max-width:640px){ .tl-footer .foot-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.tl-footer .foot-grid > div{ padding:44px 0 28px; min-width:0; }
.tl-footer .foot-grid h5{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--ink); margin:0 0 16px; }
.tl-footer .foot-grid ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
.tl-footer .foot-grid a{ text-decoration:none; font-size:13.5px; color:var(--ink-soft); font-weight:500; transition:color .15s ease; }
.tl-footer .foot-grid a:hover{ color:var(--cta); }
.tl-footer .foot-bottom{ padding:20px 0 96px; border-top:1px solid var(--line-strong); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:10.5px; color:var(--ink-soft); }
.tl-footer .logo{ display:inline-flex; align-items:center; text-decoration:none; margin-bottom:14px; }
.tl-footer .logo img{ display:block; height:18px; width:auto; max-width:100%; }

/* ---------- Generic components ---------- */
.tl-page .btn{ display:inline-block; font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:600; font-size:15px; letter-spacing:0; text-transform:none; padding:15px 34px; background:var(--ink); color:var(--bg); text-decoration:none; border-radius:9999px; transition:opacity .15s ease; }
.tl-page .btn:hover{ opacity:.8; }
.tl-page .btn.primary{ background:var(--ink); color:var(--bg); }
.tl-page .btn.primary:hover{ opacity:.8; }
.tl-page .btn.secondary{ border:1px solid var(--line-strong); color:var(--ink); background:transparent; padding:14px 33px; border-radius:9999px; }
.tl-page .btn.secondary:hover{ background:var(--surface-2); }
.tl-page .btn.btn-large{ padding:20px 46px; font-size:17px; border-radius:9999px; }
.hero-ctas .btn.primary{
  background:rgba(77,120,255,.72); color:#fff; padding:21px 46px; font-size:17.5px;
  border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(200%); -webkit-backdrop-filter:blur(18px) saturate(200%);
  animation:heroCtaGlow 2.4s ease-in-out infinite;
}
.hero-ctas .btn.primary:hover{ opacity:1; background:rgba(77,120,255,.85); }
@keyframes heroCtaGlow{
  0%,100%{ box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 0 0 0 rgba(90,135,255,.5), 0 8px 30px rgba(62,106,225,.45); }
  50%{ box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 0 0 12px rgba(90,135,255,0), 0 8px 46px rgba(90,135,255,.85); }
}
@media (prefers-reduced-motion: reduce){ .hero-ctas .btn.primary{ animation:none; box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 8px 38px rgba(90,135,255,.65); } }
.tl-page .btnrow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.tl-page .cta-band{ text-align:center; padding:64px 0; }
.tl-page .cta-band h2{ font-size:clamp(28px,4.2vw,48px); margin-bottom:20px; }
.tl-page .cta-band p{ color:var(--ink-soft); font-size:16px; margin:0 0 28px; }
.tl-page .legal{ background:var(--ink); color:rgba(245,245,243,0.72); }
.tl-page .legal h2{ color:var(--bg); font-size:clamp(26px,3.6vw,40px); margin-bottom:20px; max-width:26ch; }
.tl-page .legal p{ font-size:15px; line-height:1.75; max-width:70ch; margin:0 0 14px; }
.tl-page .legal ul{ margin:0 0 22px; padding-left:20px; font-size:15px; line-height:1.85; max-width:70ch; }
.tl-page .legal .note{ font-size:12px; color:rgba(245,245,243,0.5); border-top:1px solid rgba(245,245,243,.2); padding-top:16px; margin-top:20px; }
.tl-contact-photo{ width:100%; aspect-ratio:21/9; background-size:cover; background-position:center; }
@media (max-width:640px){ .tl-contact-photo{ aspect-ratio:4/3; } }
.tl-contact-band{ background:var(--ink); padding:clamp(40px,6vw,72px) 0; border-bottom:1px solid var(--line); }
.tl-contact-band .container{ max-width:1600px; margin:0 auto; padding:0 clamp(20px, 5vw, 96px); }
.tl-contact-band-inner{ display:flex; align-items:center; justify-content:space-between; gap:48px; flex-wrap:wrap; }
.tl-contact-band-text{ flex:1 1 420px; min-width:0; }
.tl-contact-band .mono{ color:rgba(245,245,243,.65); }
.tl-contact-band h1{ color:var(--bg); font-size:clamp(28px,6vw,48px); line-height:1.17; max-width:22ch; margin:14px 0 0; }
.tl-contact-band p{ color:rgba(245,245,243,.78); font-size:clamp(17px,1.6vw,21px); line-height:1.65; margin:22px 0 0; max-width:58ch; }
.tl-contact-band-steps{ display:flex; gap:clamp(20px,3vw,40px); flex-shrink:0; }
.tl-contact-step{ display:flex; flex-direction:column; align-items:center; gap:12px; width:84px; text-align:center; }
.tl-contact-step svg{ width:28px; height:28px; color:#fff; flex-shrink:0; }
.tl-contact-step span{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11.5px; letter-spacing:.04em; color:rgba(245,245,243,.75); }
@media (max-width:860px){ .tl-contact-band-inner{ justify-content:center; text-align:center; } .tl-contact-band-steps{ justify-content:center; width:100%; margin-top:8px; } .tl-contact-band h1, .tl-contact-band p{ max-width:none; } }
@media (max-width:460px){ .tl-contact-band-steps{ flex-wrap:wrap; row-gap:28px; } .tl-contact-step{ width:40%; } }
header.tl-intro{ padding:clamp(48px,7vw,110px) 0 clamp(32px,5vw,56px); border-bottom:1px solid var(--line); }
header.tl-intro .container{ max-width:1600px; margin:0 auto; padding:0 clamp(20px, 5vw, 96px); }
header.tl-intro h1{ font-size:clamp(28px,6vw,48px); line-height:1.17; max-width:20ch; }
header.tl-intro p{ color:var(--ink-soft); font-size:clamp(17px,1.6vw,21px); line-height:1.65; margin:22px 0 0; max-width:58ch; }
header.tl-intro.tl-intro-split{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; align-items:end; max-width:1600px; margin:0 auto; padding-left:clamp(20px, 5vw, 96px); padding-right:clamp(20px, 5vw, 96px); box-sizing:border-box; }
@media (max-width:820px){ header.tl-intro.tl-intro-split{ grid-template-columns:1fr; } }
header.tl-intro.tl-intro-hero{ position:relative; background-size:cover; background-position:center; min-height:52vh; display:flex; align-items:flex-end; border-bottom:none; padding:0; }
header.tl-intro.tl-intro-hero::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,15,20,.1) 0%, rgba(11,15,20,.82) 100%); }
/* Video-Hero (Journal Perserteppich): Video fuellt den Hero randlos wie das Hintergrundbild (object-fit:cover = background-size:cover), Verlauf und Text liegen darueber. Das Hintergrundbild bleibt als Fallback, wenn das Video nicht laedt oder Bewegung reduziert werden soll. */
header.tl-intro.tl-intro-hero > video.tl-intro-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block; pointer-events:none; }
header.tl-intro.tl-intro-hero.has-video::before{ z-index:1; }
header.tl-intro.tl-intro-hero.has-video .container{ z-index:2; }
@media (prefers-reduced-motion: reduce){ header.tl-intro.tl-intro-hero > video.tl-intro-video{ display:none; } }
header.tl-intro.tl-intro-hero .container{ position:relative; z-index:1; padding-top:clamp(48px,7vw,110px); padding-bottom:clamp(40px,6vw,64px); }
header.tl-intro.tl-intro-hero p.mono{ color:rgba(255,255,255,.85); }
header.tl-intro.tl-intro-hero h1{ color:#fff; }
header.tl-intro.tl-intro-hero p{ color:rgba(255,255,255,.85); }
@media (max-width:640px){ header.tl-intro.tl-intro-hero{ min-height:44vh; } }
header.tl-intro.tl-intro-hero.tl-intro-split{ display:grid; grid-template-columns:1.3fr 1fr; padding-top:clamp(48px,7vw,110px); padding-bottom:clamp(40px,6vw,64px); }
header.tl-intro.tl-intro-hero.tl-intro-split > div{ position:relative; z-index:1; }
header.tl-intro.tl-intro-hero.tl-intro-split p.mono{ color:rgba(255,255,255,.85); }
header.tl-intro.tl-intro-hero.tl-intro-split h1{ color:#fff; }
header.tl-intro.tl-intro-hero.tl-intro-split > div > p{ color:rgba(255,255,255,.85); }
/* Split-Hero (Unternehmen): .tl-intro-hero setzt padding:0 und hob damit das Seitenpadding der Split-Variante auf (Text klebte am Bildschirmrand), die 1-Spalten-Regel unter 821px griff wegen hoeherer Spezifitaet nicht. Aussenkanten jetzt wie .container (max. 1600px + Seitenpadding), Hintergrund randlos wie bei den anderen Heros. */
header.tl-intro.tl-intro-hero.tl-intro-split{ --split-pad:clamp(20px, 5vw, 96px); max-width:none; margin:0; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); padding-left:max(var(--split-pad), calc((100% - 1600px) / 2 + var(--split-pad))); padding-right:max(var(--split-pad), calc((100% - 1600px) / 2 + var(--split-pad))); }
@media (max-width:820px){ header.tl-intro.tl-intro-hero.tl-intro-split{ grid-template-columns:minmax(0,1fr); } }
.hero-intro{ padding:clamp(32px,5vw,48px) clamp(20px, 5vw, 96px) 0; max-width:1600px; margin:0 auto; box-sizing:border-box; }
.hero-intro p{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:clamp(19px,2.2vw,24px); font-weight:500; letter-spacing:-0.01em; line-height:1.45; color:var(--ink); max-width:52ch; margin:0; }
.honest-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:32px 36px; font-size:15px; line-height:1.65; color:var(--ink-soft); }
.honest-box b{ color:var(--ink); }

.mailpoet_form{ display:flex !important; flex-wrap:wrap; gap:10px; align-items:flex-start; }
.mailpoet_form .mailpoet_paragraph{ margin:0 !important; }
.mailpoet_form .mailpoet_paragraph:has(.mailpoet_text){ flex:1 1 260px; }
.mailpoet_form .mailpoet_paragraph:has(.mailpoet_submit){ flex:0 0 auto; }
.mailpoet_form .mailpoet_text{ width:100% !important; padding:14px 16px !important; margin:0 !important; border:1px solid var(--line) !important; border-radius:10px !important; font-family:'Inter',Helvetica,Arial,sans-serif !important; font-size:15px !important; color:var(--ink); background:var(--bg); box-sizing:border-box; }
.mailpoet_form .mailpoet_submit{ width:auto !important; padding:15px 34px !important; margin:0 !important; background:var(--ink) !important; color:var(--bg) !important; border:none !important; border-radius:9999px !important; font-family:'Inter',Helvetica,Arial,sans-serif !important; font-weight:600 !important; font-size:15px !important; letter-spacing:0; text-transform:none; cursor:pointer; transition:opacity .15s ease; }
.mailpoet_form .mailpoet_submit:hover{ opacity:.8; }
.mailpoet_form .mailpoet_message{ flex-basis:100%; margin:12px 0 0; }

/* ---------- Homepage ---------- */

.tl-process{ padding:clamp(50px,7.2vw,86px) 0; background:var(--surface-2); border-bottom:1px solid var(--line-strong); }

/* Vier-Schritte-Karten: 4 Spalten erst ab 1181px (darunter waeren die Karten schmaler als ihr Inhalt und ragten ueber den Container), minmax(0,1fr) verhindert Overflow. */

}

@media (max-width:820px){ .partner-main{ border-right:none; border-bottom:1px solid rgba(245,245,243,.16); padding-left:clamp(20px,5vw,96px); padding-right:clamp(20px,5vw,96px); } .partner-col{ padding-left:clamp(20px,5vw,96px); padding-right:clamp(20px,5vw,96px); } }
.partner-strip h2{ color:var(--bg); font-size:clamp(24px,4vw,40px); line-height:1.2; }
/* Labels im dunklen Partner-Streifen: --accent ist im hellen Theme #171A20 = Hintergrundfarbe, daher feste helle Sekundaerfarbe. */
.partner-strip .mono{ color:rgba(245,245,243,.78); }
.partner-main p{ color:rgba(245,245,243,.66); font-size:16px; line-height:1.65; font-weight:500; max-width:42ch; margin:20px 0 0; }

.partner-col p{ color:rgba(245,245,243,.66); font-size:14.5px; line-height:1.6; margin:0; }
.partner-col a{ display:inline-block; margin-top:18px; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11.5px; font-weight:600; color:var(--bg); text-decoration:none; letter-spacing:.05em; text-transform:uppercase; border-bottom:1px solid rgba(245,245,243,.45); padding-bottom:3px; }
/* Partner-Streifen: feste Anordnung (Headline oben Mitte, Vertriebspartner unten links, Karriere unten rechts) und Aussenkanten buendig mit .container (max. 1600px + Seitenpadding). Vanta.NET legt leere Text-Spans als zusaetzliche Grid-Kinder an, die werden ausgeblendet. */
.partner-strip{ --pl-pad:clamp(20px,5vw,96px); --pl-edge:max(var(--pl-pad), calc((100vw - 1600px) / 2 + var(--pl-pad))); container-type:inline-size; }

.partner-strip > span{ display:none; }
@media (min-width:821px){

  .partner-strip > .partner-main{ grid-area:main; }
  .partner-strip > .partner-col:nth-of-type(2){ grid-area:left; padding-left:var(--pl-edge); }
  .partner-strip > .partner-col:nth-of-type(3){ grid-area:right; padding-right:var(--pl-edge); text-align:right; border-right:none; }
}

@media (max-width:620px){

.zusatz{ padding-top:88px; }

/* ---------- Unternehmen ---------- */
.segments{ background:var(--surface-2); border-bottom:1px solid var(--line); }

.seg{ border-top:2px solid var(--ink); padding:22px 0 0; }

.seg p{ font-size:15px; color:var(--ink-soft); line-height:1.65; margin:0; }
.b2b-process-head{ margin-bottom:40px; max-width:60ch; }

.b2b-process-head p{ color:var(--ink-soft); font-size:16.5px; line-height:1.65; }
.p-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:40px; border-top:1px solid var(--line-strong); }

@media (max-width:520px){ .p-steps{ grid-template-columns:1fr; } }
.p-step{ padding:28px 0 0; }
.p-step .n{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; color:var(--accent); display:block; margin-bottom:10px; }
.p-step h4{ font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:700; font-size:15px; margin:0 0 8px; text-transform:none; letter-spacing:0; }
.p-step p{ font-size:14.5px; color:var(--ink-soft); line-height:1.6; margin:0; max-width:26ch; }
.modell{ background:var(--ink); color:rgba(245,245,243,.86); }

.modell-grid{ display:grid; grid-template-columns:1fr 1fr; gap:48px; border-top:1px solid rgba(245,245,243,.2); margin-top:12px; }

.modell-col{ padding:32px 0 0; }
.modell-col h4{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
.modell-col p{ font-size:15.5px; line-height:1.7; color:rgba(245,245,243,.7); margin:0; }
/* Labels und Buttons in dunklen Sektionen (.legal, .modell): --accent bzw. --line-strong/--ink sind im hellen Theme #171A20 = Hintergrundfarbe, daher feste helle Farben (wie im Partner-Streifen). !important wegen Inline-Style color:var(--accent) im Seiteninhalt. */

/* ---------- Hygienereinigung ---------- */
.verfahren{ background:var(--surface-2); border-bottom:1px solid var(--line); }
.verf-grid{ display:grid; grid-template-columns:0.8fr 1.2fr; gap:56px; align-items:start; }

.verf-stat{ background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:44px 40px; }
.verf-stat .v{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:56px; font-weight:700; line-height:1; color:var(--accent); }
.verf-stat .l{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:10px; display:block; }
.verf-stat p{ font-size:14.5px; color:var(--ink-soft); line-height:1.65; margin:18px 0 0; padding-top:18px; border-top:1px solid var(--line); }
.verf-text h2{ font-size:clamp(28px,4vw,44px); margin-bottom:16px; }
.verf-text p{ font-size:15px; line-height:1.7; color:var(--ink); margin:0 0 16px; max-width:56ch; }
.fuer-wen{ padding-top:88px; }
.fw-head{ margin-bottom:36px; max-width:60ch; }
.fw-head h2{ font-size:clamp(28px,4vw,48px); margin-bottom:14px; }
.fw-head p{ color:var(--ink-soft); font-size:16.5px; line-height:1.65; }

.fw{ border-top:2px solid var(--ink); padding:22px 0 0; }
.fw h3{ font-size:18px; margin-bottom:12px; }
.fw p{ font-size:15px; color:var(--ink-soft); line-height:1.7; margin:0; }

/* ---------- Wer wir sind ---------- */
.story{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:64px; align-items:start; }
@media (max-width:860px){ .story{ grid-template-columns:1fr; gap:36px; } }
.story-figure{ border:1px solid var(--line-strong); border-radius:16px; background:var(--surface-2); padding:0 0 28px; position:sticky; top:32px; overflow:hidden; }
@media (max-width:860px){ .story-figure{ position:static; } }
.story-figure img.portrait{ width:100%; aspect-ratio:4/5; object-fit:cover; display:block; margin-bottom:22px; }
.story-figure svg{ width:120px; height:120px; display:block; margin:32px auto 20px; }
.story-figure h3, .story-figure .role, .story-figure ul{ margin-left:32px; margin-right:32px; }
.story-figure h3{ font-size:20px; margin-bottom:6px; }
.story-figure .role{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin-bottom:18px; display:block; }
.story-figure ul{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.story-figure li{ display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px; }
.story-figure li span:first-child{ color:var(--ink-soft); font-family:'Inter',Helvetica,Arial,sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; }
.story-figure li span:last-child{ font-weight:700; text-align:right; }
.story-text p{ font-size:16px; line-height:1.75; color:var(--ink); margin:0 0 20px; max-width:62ch; }
.story-text p.lead{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:clamp(22px,3vw,28px); text-transform:none; letter-spacing:-0.01em; font-weight:500; line-height:1.3; margin-bottom:26px; }
.story-text .mono-label{ display:block; margin-bottom:10px; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.story-alt{ border-top:1px solid var(--line); padding-top:88px; }
.story-alt .story-figure{ order:2; }
.story-alt .story-text{ order:1; }
@media (max-width:860px){ .story-alt .story-figure{ order:1; } .story-alt .story-text{ order:2; } }
.values{ background:var(--surface-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.values-head{ margin-bottom:40px; max-width:60ch; }
.values-head h2{ font-size:clamp(28px,4vw,48px); margin-bottom:14px; }
.values-head p{ color:var(--ink-soft); font-size:16.5px; line-height:1.65; }
.values-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media (max-width:820px){ .values-grid{ grid-template-columns:1fr; gap:16px; } }
.value{ background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:32px 28px; }
.value .n{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--accent); text-transform:uppercase; margin-bottom:16px; display:block; }
.value h4{ font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:600; font-size:18px; letter-spacing:-0.01em; margin:0 0 10px; text-transform:none; }
.value p{ font-size:15px; color:var(--ink-soft); line-height:1.65; margin:0; }
.team{ padding-top:88px; }
.team-head{ margin-bottom:32px; max-width:64ch; }
.team-head h2{ font-size:clamp(28px,4vw,48px); margin-bottom:14px; }
.team-head p{ color:var(--ink-soft); font-size:15px; line-height:1.65; }
.stats{ display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--line-strong); margin-top:36px; }
.stat{ flex:1; min-width:180px; padding:22px 26px 20px 0; border-right:1px solid var(--line); }
.stat:not(:first-child){ padding-left:26px; }
.stat:last-child{ border-right:none; }
.stat .v{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:clamp(26px,6vw,38px); font-weight:700; line-height:1.1; }
.stat .l{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:10px; display:block; }

/* ---------- Impressum & Kontakt ---------- */
.kontakt{ background:var(--surface-2); border-bottom:1px solid var(--line); padding-top:64px; }
.kontakt .section-head{ padding-bottom:48px; }
.kontakt-map{ border-radius:24px; overflow:hidden; border:1px solid var(--line); margin-bottom:32px; height:280px; }
.kontakt-map iframe{ width:100%; height:100%; border:0; display:block; }
.kontakt-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media (max-width:760px){ .kontakt-grid{ grid-template-columns:1fr; gap:16px; } }
.kcard{ background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:32px; transition:border-color .2s ease; }
.kcard:hover{ border-color:var(--line-strong); }
.kcard .icon{ width:26px; height:26px; color:#4D78FF; display:block; margin-bottom:20px; }
.kcard .l{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:10px; }
.kcard a, .kcard p{ font-size:17px; font-weight:700; color:var(--ink); text-decoration:none; margin:0; line-height:1.5; }
.kcard a:hover{ color:#4D78FF; }
.impressum{ padding-top:80px; }
.imp-head{ margin-bottom:32px; }
.imp-head h2{ font-size:clamp(26px,3.6vw,40px); }
.imp-block{ max-width:64ch; margin-bottom:36px; }
.imp-block h3{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
.imp-block p{ font-size:16px; line-height:1.75; color:var(--ink); margin:0 0 8px; }
.imp-block p.soft{ color:var(--ink-soft); }
.imp-block a{ color:var(--ink); }
.pending{ display:inline-block; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); border:1px solid var(--accent); padding:2px 8px; margin-left:6px; }
.todo-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:32px 36px; max-width:70ch; margin-top:24px; }
.todo-box .l{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:12px; }
.todo-box ul{ margin:0; padding-left:20px; font-size:13.5px; line-height:1.8; color:var(--ink-soft); }

/* ---------- Kontakt-Wizard ---------- */
.wizard{ max-width:820px; margin:0 auto; padding-bottom:56px; }
.wizard-progress{ display:flex; gap:8px; margin-bottom:20px; }
.wizard-progress .bar{ flex:1; height:3px; background:var(--line); border-radius:2px; }
.wizard-progress .bar.active{ background:var(--ink); }
.wizard-step{ display:none; }
.wizard-step.active{ display:block; animation:wizardFade .25s ease; }
@keyframes wizardFade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
.wizard-step h2{ font-size:clamp(22px,3vw,32px); margin-bottom:8px; }
.wizard-step .step-sub{ color:var(--ink-soft); font-size:15px; margin:0 0 32px; }
.wizard-options{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:8px; }
@media (max-width:600px){ .wizard-options{ grid-template-columns:1fr; } }
.wizard-option{ border:1px solid var(--line); border-radius:16px; padding:24px; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
.wizard-option:hover{ border-color:var(--ink); }
.wizard-option.selected{ border-color:var(--ink); background:var(--surface-2); }
.wizard-option h4{ font-size:16px; margin:0 0 6px; }
.wizard-option p{ font-size:13.5px; color:var(--ink-soft); margin:0; }
.carpet-pakete{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
.carpet-pakete .paket-chip{ border:1px solid var(--line); border-radius:12px; padding:10px 16px; cursor:pointer; font-size:13px; transition:border-color .15s ease, background .15s ease; }
.carpet-pakete .paket-chip:hover{ border-color:var(--ink); }
.carpet-pakete .paket-chip.selected{ border-color:rgba(77,120,255,.85); background:rgba(77,120,255,.72); color:#fff; }
.wizard-field{ margin-bottom:20px; }
.wizard-field label{ display:block; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
.wizard-field input, .wizard-field select, .wizard-field textarea{ width:100%; border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:15px; color:var(--ink); background:var(--bg); }
.wizard-field textarea{ min-height:100px; resize:vertical; }
.wizard-field input:focus, .wizard-field select:focus, .wizard-field textarea:focus{ outline:none; border-color:var(--ink); }
.wizard-nav{ display:flex; justify-content:space-between; margin-top:36px; }
.wizard-nav button{ font-family:'Inter',Helvetica,Arial,sans-serif; font-weight:600; font-size:15px; padding:14px 30px; border-radius:9999px; cursor:pointer; border:none; }
.wizard-nav .btn-next{ background:var(--ink); color:var(--bg); }
.wizard-nav .btn-next:disabled{ opacity:.35; cursor:not-allowed; }
.wizard-nav .btn-back{ background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
.wizard-summary{ border:1px solid var(--line); border-radius:16px; padding:8px 28px; margin-bottom:24px; }
.wizard-summary .row{ display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); font-size:14px; }
.wizard-summary .row:last-child{ border-bottom:none; }
.wizard-summary .row span:first-child{ color:var(--ink-soft); white-space:nowrap; }
.wizard-summary .row span:last-child{ font-weight:600; text-align:right; }
.wizard-consent{ display:flex; gap:12px; align-items:flex-start; font-size:13.5px; color:var(--ink-soft); margin:24px 0 0; }
.wizard-consent input{ margin-top:3px; }

/* ---------- FAQ ---------- */
.faq-group{ max-width:900px; margin:0 auto 56px; }
.faq-group:last-child{ margin-bottom:0; }
.faq-list{ border-top:1px solid var(--line-strong); }
.faq-item{ border-bottom:1px solid var(--line); }
.faq-q{ width:100%; text-align:left; background:none; border:none; padding:22px 0; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:16.5px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:16px; }
.faq-q .icon{ font-size:22px; font-weight:400; color:var(--ink-soft); transition:transform .2s ease; flex-shrink:0; line-height:1; }
.faq-item.open .faq-q .icon{ transform:rotate(45deg); }
.faq-a{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
.faq-item.open .faq-a{ max-height:600px; }
.faq-a p{ padding:0 0 24px; font-size:15px; line-height:1.7; color:var(--ink-soft); max-width:70ch; margin:0; }
.faq-a a{ color:var(--ink); font-weight:600; }

/* ---------- Journal / Artikel ---------- */
.article-body{ padding:clamp(56px,8vw,96px) 0 32px; }
.article-body .container{ max-width:760px; }
.article-meta{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 28px; }
.article-body .lede{ font-size:19px; line-height:1.65; color:var(--ink-soft); margin:0 0 8px; max-width:68ch; }
.article-body h2{ font-size:clamp(21px,2.6vw,28px); line-height:1.28; margin:48px 0 16px; max-width:30ch; }
.article-body p{ font-size:16.5px; line-height:1.75; margin:0 0 20px; max-width:68ch; }
.article-body ul{ font-size:16.5px; line-height:1.75; margin:0 0 24px; padding-left:22px; max-width:68ch; }
.article-body ul li{ margin-bottom:8px; }
.article-body .honest-box{ margin:36px 0; max-width:68ch; }
.article-back{ padding:8px 0 48px; }
.article-back a{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:13.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; }
.article-back a:hover{ color:var(--ink); }
.journal-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(44px,4.5vw,64px) clamp(24px,2.4vw,36px); margin-top:32px; }
.journal-card{ min-width:0; text-decoration:none; color:inherit; display:flex; flex-direction:column; transition:transform .25s ease; }
.journal-card .journal-media{ aspect-ratio:16/10; border-radius:20px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); margin-bottom:22px; transition:box-shadow .25s ease; }
.journal-card .journal-media img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
.journal-card .journal-body{ display:flex; flex-direction:column; flex:1; min-width:0; }
.journal-card:hover{ transform:translateY(-4px); }
.journal-card:hover .journal-media{ box-shadow:0 18px 40px rgba(23,26,32,.12); }
.journal-card:hover .journal-media img{ transform:scale(1.03); }
.journal-card:focus-visible{ outline:2px solid #4D78FF; outline-offset:6px; border-radius:20px; }
.journal-card .cat{ font-family:'Inter',Helvetica,Arial,sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#4D78FF; margin-bottom:12px; }
.journal-card h3{ font-size:20px; line-height:1.3; letter-spacing:-0.01em; margin:0 0 10px; }
.journal-card p{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin:0; flex:1; }
.journal-card .read-more{ margin-top:18px; font-family:'Inter',Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; }
.journal-card.is-featured{ grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:clamp(32px,4.5vw,72px); align-items:center; }
.journal-card.is-featured .journal-media{ margin-bottom:0; border-radius:24px; }
.journal-card.is-featured h3{ font-size:clamp(24px,2.5vw,36px); line-height:1.18; margin-bottom:14px; }
.journal-card.is-featured p{ font-size:16px; flex:0 0 auto; max-width:46ch; }
@media (max-width:1024px){ .journal-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

<script>
(function(){
  var btn = document.getElementById('tl-menu-toggle');
  var menu = document.getElementById('tl-mobile-menu');
  var closeBtn = document.getElementById('tl-mobile-menu-close');
  if (!btn || !menu) return;
  var scrollY = 0;
  function lockScroll(){
    scrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = (-scrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    if (window.__lenis) window.__lenis.stop();
  }
  function unlockScroll(){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, scrollY);
    if (window.__lenis) window.__lenis.start();
  }
  function openMenu(){
    menu.classList.add('is-open');
    btn.textContent = 'Schließen';
    btn.setAttribute('aria-expanded', 'true');
    lockScroll();
  }
  function closeMenu(){
    menu.classList.remove('is-open');
    menu.scrollTop = 0;
    btn.textContent = 'Menü';
    btn.setAttribute('aria-expanded', 'false');
    unlockScroll();
  }
  btn.addEventListener('click', function(){
    if (menu.classList.contains('is-open')) closeMenu(); else openMenu();
  });
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', closeMenu);
  });
  if (closeBtn) closeBtn.addEventListener('click', closeMenu);

  var allLangBtns = document.querySelectorAll('.lang-switcher .lang-btn');
  allLangBtns.forEach(function(b){
    b.addEventListener('click', function(){
      var lang = b.getAttribute('data-lang');
      if (lang === 'de') {
        try { localStorage.removeItem('__GT_TRANSLATE_LANGS'); } catch (e) {}
        window.location.reload();
        return;
      }
      if (window.doGTranslate && lang) window.doGTranslate('de|' + lang);
      allLangBtns.forEach(function(x){ x.classList.toggle('is-active', x.getAttribute('data-lang') === lang); });
      if (menu.classList.contains('is-open')) closeMenu();
    });
  });
})();
</script>
